<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Kumchop orange logo</title>
  <desc id="desc">Orange handwritten Kumchop logo with fork, chef hat and spoon icon, and the slogan Every taste feels good...</desc>
  <defs>
    <linearGradient id="orangeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff8a1a"/>
      <stop offset="50%" stop-color="#ff6500"/>
      <stop offset="100%" stop-color="#ff7d00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#d15d00" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- fork left -->
    <g transform="translate(110,100)" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 44 L38 230"/>
      <path d="M22 54 L22 220"/>
      <path d="M54 54 L54 220"/>
      <path d="M6 86 L70 86"/>
      <path d="M10 126 L62 126"/>
      <path d="M14 166 L58 166"/>
      <path d="M28 40 C28 12, 22 0, 16 -20 C28 -18, 48 -16, 54 0 C58 18, 52 32, 38 40"/>
    </g>

    <!-- main wordmark -->
    <text x="310" y="390"
      font-size="250"
      font-family="'Segoe Print', 'Bradley Hand', 'Segoe Script', cursive"
      font-weight="700"
      fill="url(#orangeGrad)"
      letter-spacing="-10">Kumchop</text>

    <!-- chef hat + plate on right -->
    <g transform="translate(1130,95)">
      <path d="M110 0 C149 2, 183 25, 194 68 C209 130, 168 166, 112 169 C68 172, 14 151, -3 116 C-18 89, -13 56, 18 30 C35 17, 63 6, 110 0 Z"
        fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 32 C48 14, 78 2, 110 2 C146 2, 172 18, 188 52" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M125 14 C118 42, 114 62, 112 95" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M36 47 C62 38, 82 39, 104 44" fill="none" stroke="url(#orangeGrad)" stroke-width="11" stroke-linecap="round"/>
      <path d="M0 138 C28 118, 52 110, 81 109 C118 107, 154 119, 189 144" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M42 142 C32 156, 30 170, 34 186" fill="none" stroke="url(#orangeGrad)" stroke-width="11" stroke-linecap="round"/>
      <path d="M102 143 C91 161, 87 178, 90 192" fill="none" stroke="url(#orangeGrad)" stroke-width="11" stroke-linecap="round"/>
      <path d="M156 143 C163 160, 169 177, 174 194" fill="none" stroke="url(#orangeGrad)" stroke-width="11" stroke-linecap="round"/>
      <path d="M76 104 C76 94, 76 82, 88 74 C99 66, 118 69, 126 81 C135 95, 133 115, 119 124 C106 132, 86 131, 76 104 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="10"/>
    </g>

    <!-- spoon / cutlery on far right -->
    <g transform="translate(1400,220)">
      <path d="M28 55 C16 24, 7 4, 19 -18 C25 -31, 40 -35, 50 -24 C60 -13, 57 10, 59 28 L68 160" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
      <path d="M55 29 C80 18, 94 18, 108 28 C124 40, 142 59, 146 88" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
      <path d="M52 58 C99 55, 123 63, 141 88" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
      <path d="M88 33 C86 14, 90 0, 103 -16" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- slogan -->
    <text x="340" y="585"
      font-size="86"
      font-family="'Segoe Print', 'Bradley Hand', 'Segoe Script', cursive"
      font-style="italic"
      fill="url(#orangeGrad)">Every taste feels good...</text>
  </g>
</svg>
